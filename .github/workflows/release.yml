name: Release plugin ZIP

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and attach release ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches plugin header version
        id: verify
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"
          PLUGIN_VERSION="$(grep -E '^[[:space:]]*\*[[:space:]]*Version:' wp-agency-admin-toolkit-pro.php | head -n1 | awk -F: '{print $2}' | tr -d ' ')"
          CONST_VERSION="$(grep -E "define\('AAT_VERSION'" wp-agency-admin-toolkit-pro.php | head -n1 | sed -E "s/.*'([^']+)'\);/\1/")"
          README_VERSION="$(grep -E '^Stable tag:' readme.txt | awk -F: '{print $2}' | tr -d ' ')"

          echo "Tag:       $TAG_VERSION"
          echo "Header:    $PLUGIN_VERSION"
          echo "Constant:  $CONST_VERSION"
          echo "Readme:    $README_VERSION"

          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match plugin header Version: $PLUGIN_VERSION"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$CONST_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match AAT_VERSION constant: $CONST_VERSION"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$README_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match readme.txt Stable tag: $README_VERSION"
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage plugin folder
        run: |
          mkdir -p build/wp-agency-admin-toolkit-pro
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='build' \
            --exclude='vendor' \
            --exclude='composer.lock' \
            --exclude='RELEASE-WORKFLOW.md' \
            --exclude='*.zip' \
            ./ build/wp-agency-admin-toolkit-pro/

      - name: Create release ZIP
        working-directory: build
        run: zip -rq ../wp-agency-admin-toolkit-pro.zip wp-agency-admin-toolkit-pro

      - name: Attach ZIP to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: wp-agency-admin-toolkit-pro.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
